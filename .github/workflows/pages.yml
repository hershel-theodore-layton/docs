name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate site
        run: ./generate_docs.py --base-path "${{ steps.pages.outputs.base_path }}"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
